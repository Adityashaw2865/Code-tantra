name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax-check every source file
        run: for f in $(find src -name '*.js'); do node --check "$f" || exit 1; done
      - name: Run tests (spins up its own in-memory MongoDB)
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-not-for-real-use-0123456789

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: govease2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: govease2/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t vyaparsetu-backend ./backend
      - name: Build frontend image
        run: docker build -t vyaparsetu-frontend ./govease2
